name: build

# Каждый push в main собирает GnirehtetSquad.exe (артефакт).
# Если <Version> в src/GnirehtetSquad/GnirehtetSquad.csproj новая (тега vX.Y.Z ещё нет) —
# workflow сам создаёт тег и релиз с zip. Формат zip совместим с OTA-апдейтером 1.x/2.x.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: version
        shell: pwsh
        run: |
          [xml]$proj = Get-Content src/GnirehtetSquad/GnirehtetSquad.csproj -Raw
          $appVer = $proj.Project.PropertyGroup | ForEach-Object { $_.Version } | Where-Object { $_ } | Select-Object -First 1
          if (-not $appVer) { throw "Version не найден в csproj" }
          $release = 'false'
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $ver = $env:GITHUB_REF_NAME.TrimStart('v'); $release = 'true'
          } elseif ($env:GITHUB_EVENT_NAME -eq 'push' -and $env:GITHUB_REF_NAME -eq 'main' -and -not (git tag -l "v$appVer")) {
            $ver = $appVer; $release = 'true'
          } else {
            $ver = "dev-$($env:GITHUB_SHA.Substring(0,7))"
          }
          "VER=$ver" >> $env:GITHUB_ENV
          "RELEASE=$release" >> $env:GITHUB_ENV
          Write-Host "Версия: $ver, релиз: $release"
      - name: build
        shell: pwsh
        run: ./scripts/publish.ps1 -Version $env:VER
      - name: check zip
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $z = [IO.Compression.ZipFile]::OpenRead("dist/GnirehtetSquad-$env:VER-win64.zip")
          $z.Entries | ForEach-Object { "$($_.FullName)  $($_.Length)" }
          $ok = $z.Entries | Where-Object { ($_.FullName -replace '\\','/') -eq 'GnirehtetSquad/GnirehtetSquad.exe' }
          $z.Dispose()
          if (-not $ok) { throw "В архиве нет GnirehtetSquad/GnirehtetSquad.exe — OTA не сработает" }
      - uses: actions/upload-artifact@v4
        with:
          name: GnirehtetSquad-${{ env.VER }}-win64
          path: dist/GnirehtetSquad
      - name: release
        if: env.RELEASE == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VER }}
          target_commitish: ${{ github.sha }}
          name: Gnirehtet Squad ${{ env.VER }}
          files: dist/GnirehtetSquad-${{ env.VER }}-win64.zip
          body: |
            Скачайте `GnirehtetSquad-${{ env.VER }}-win64.zip`, распакуйте и запустите `GnirehtetSquad.exe`.
            Если стоит версия 1.1.0 или новее, программа обновится сама.
